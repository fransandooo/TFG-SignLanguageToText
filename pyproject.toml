[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slr"
version = "0.1.0"
description = "Sign Language Recognition pipeline"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tensorboard>=2.12",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
landmarks = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

base_config: ../../base/gru_attention.yaml

experiment_id: wlasl30_seed2026_frames96
title: Sequence length sweep - 96 frames (seed 2026)
research_question: >
  Does increasing sequence length from 64 to 96 frames improve WLASL30
  recognition accuracy under the same GRU+Attention architecture?
  Run with seed 2026 for multi-seed aggregation.

dataset:
  name: wlasl30
  root: 06_datasets/wlasl/landmarks/wlasl100_filtered30
  metadata: 06_datasets/wlasl/landmarks/wlasl100_filtered30/metadata.json
  max_frames: 96
  input_size: 63
  split_strategy: train/val/test

training:
  seed: 2026

output_dir: 05_experiments/sequence_length_sweep/wlasl30_seed2026_frames96
